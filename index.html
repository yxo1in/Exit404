<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exit404</title>
  <link rel="stylesheet" href="./css/index.css" />
  <link rel="stylesheet" href="./css/questionModal.css" />
  <link rel="stylesheet" href="./css/map.css" />
  <link rel="stylesheet" href="./css/inventoryModal.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <!-- ★ htef 오타 수정 -> href -->
  <link rel="stylesheet" href="./css/start.css" />
</head>

<body>
  <!-- 시작 화면 전체 오버레이 (body 안으로 이동) -->
  <div id="start-screen">
    <!-- 배경 이미지 (menu-container 밖으로 분리) -->
    <img src="./assets/image/main_screen.svg" class="start-bg-img" alt="background" />

    <!-- 메뉴 영역 -->
    <div class="menu-container">
      <img src="./assets/image/arrow_left.png" id="menu-arrow-left" class="menu-arrow" alt="arrow left" />

      <button class="menu-btn" data-index="0" id="btn-start">
        <img src="./assets/image/start_txt.png" alt="START" />
      </button>
      <button class="menu-btn" data-index="1" id="btn-ranking">
        <img src="./assets/image/ranking_txt.png" alt="RANKING" />
      </button>
      <button class="menu-btn" data-index="2" id="btn-language">
        <img src="./assets/image/language_txt.png" alt="LANGUAGE" />
      </button>

      <img src="./assets/image/arrow_right.png" id="menu-arrow-right" class="menu-arrow" alt="arrow right" />
    </div>
  </div>

  <!-- 게임 맵 및 UI 영역 -->
  <div id="map">
    <canvas id="mapCanvas"></canvas>
  </div>

  <div id="stamina-container">
    <div class="stamina-track">
      <div id="stamina-bar"></div>
    </div>
  </div>

  <div id="game">
    <img id="player" alt="player" data-sprite="" />
    <img id="teacher" alt="teacher" data-sprite="" />
  </div>

  <!-- 인벤토리 모달 -->
  <div class="inventory-modal" id="inventory-modal">
    <div class="inventory-modal-body">
      <div class="inventory-modal-item-wrap">
        <div class="inventory-modal-user">
          <div class="userIcon"></div>
          <p class="userInfo">const INVENTORY = () => {</p>
        </div>
        <div class="inventory-modal-item" id="inventory-modal-item">
          <p class="userInfo">}</p>
        </div>
      </div>
      <div class="inventory-modal-explain">
        <div class="inventory-explain-wrap">
          <p class="inventory-title">C:\Exit404\item ></p>
          <div>
            <p class="inventory-explain">
              <span id="item-name"></span>
            </p>
            <p class="inventory-explain"><span id="item-explain"></span></p>
          </div>
        </div>
      </div>
    </div>
    <div class="inventory-modal-footer">
      <p class="inventory-modal-footer-text">close: esc</p>
    </div>
  </div>

  <!-- 문제 모달 -->
  <div class="question-modal" id="question-modal">
    <div class="question-modal-header" id="question-modal-header">
      <div class="question-modal-header-search">
        <div class="question-modal-header-search-icon"></div>
      </div>
    </div>
    <div class="question-modal-body">
      <div class="question-modal-file">
        <div class="question-modal-file-menu">
          <div class="question-modal-file-icon-wrap">
            <div class="question-modal-file-icon"
              style="background-image: url(./assets/image/ant-design_file-outlined.svg);"></div>
            <div class="question-modal-file-icon" style="background-image: url(./assets/image/bx_search-alt-2.svg);">
            </div>
          </div>
          <div class="question-modal-file-icon" style="background-image: url(./assets/image/ep_setting.svg)"></div>
        </div>
        <div class="question-modal-file-text-wrap">
          <div style="display: flex">
            <img src="./assets/image/downArrow.svg" alt="아래 화살표" />
            <p class="question-modal-file-text">JavaScript</p>
          </div>
          <div class="question-modal-file-text-sub-wrap">
            <p class="question-modal-file-text">1_quiz.js</p>
            <p class="question-modal-file-text">2_quiz.js</p>
            <p class="question-modal-file-text">3_quiz.js</p>
          </div>
        </div>
      </div>
      <div class="question-modal-anwser-wrap">
        <div class="question-modal-question">
          <div class="question-modal-question-file">
            <p class="question-modal-question-file-text">Question</p>
            <p class="question-modal-question-file-text">x</p>
          </div>
        </div>
        <div class="question-modal-answer">
          <div class="question-modal-answer-menu" id="question-modal-answer-menu"></div>
          <div class="question-modal-answer-wrap">
            <p class="question-modal-answer-text">C:\user\2026\Exit404></p>
            <div id="answer_result"></div>
          </div>
        </div>
      </div>
    </div>
  </div>



    <script type="module" src="./js/map.js"></script>
    <script type="module" src="./js/supabase.js"></script>
</body> 

</html>
