<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exit404</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <div class="question-modal">
      <div class="question-modal-header" id="question-modal-header">
        <script>
          // ================
          // 헤더 메뉴 불러오기
          // ================
          const header = document.getElementById("question-modal-header");
          const header_menu = [
            "File",
            "Edit",
            "Selection",
            "View",
            "Go",
            "Run",
            "Terminal",
          ];
          const header_res = [];
          header_menu.map((m) => {
            header_res.push(`<div class="question-modal-header-menu">${m}</div>`);
          });
          header.innerHTML += header_res.join("");
        </script>
        <div class="question-modal-header-search">
          <div class="question-modal-header-search-icon">
          </div>
        </div>
      </div>
      <div class="question-modal-body">
        <div class="question-modal-file">
          <div class="question-modal-file-menu">
            <div class="question-modal-file-icon-wrap">
              <div
                class="question-modal-file-icon"
                style="
                  background-image: url(./assets/image/ant-design_file-outlined.svg);
                "
              ></div>
              <div
                class="question-modal-file-icon"
                style="
                  background-image: url(./assets/image/bx_search-alt-2.svg);
                "
              ></div>
            </div>
            <div
              class="question-modal-file-icon"
              style="background-image: url(./assets/image/ep_setting.svg)"
            ></div>
          </div>
          <div class="question-modal-file-text-wrap">
            <div style="display: flex">
              <img src="./assets/image/downArrow.svg" alt="아래 화살표" />
              <p class="question-modal-file-text">JavaScript</p>
            </div>
            <div class="question-modal-file-text-sub-wrap">
              <p class="question-modal-file-text">1_quiz.js</p>
              <p class="question-modal-file-text">2_quiz.js</p>
              <p class="question-modal-file-text">3_quiz.js</p>
            </div>
          </div>
        </div>
        <div class="question-modal-anwser-wrap">
          <div class="question-modal-question">
            <div class="question-modal-question-file">
              <p class="question-modal-question-file-text">Question</p>
              <p class="question-modal-question-file-text">x</p>
            </div>
          </div>
          <div class="question-modal-answer">
            <div class="question-modal-answer-menu" id="question-modal-answer-menu">
              <script>
                const answer = document.getElementById('question-modal-answer-menu');
                const answer_menu = ['Problem', 'Output', 'Debug Console', 'Terminal'];
                const answer_menu_res = [];
                answer_menu.map((m) => {
                  answer_menu_res.push(`<p class="question-modal-answer-menu-text">${m}</p>`);
                })
                answer.innerHTML = answer_menu_res.join("");
              </script>
            </div>
            <div class="question-modal-answer-wrap">
              <p class="question-modal-answer-text">C:\user\2026\Exit404></p>
              <p id="answer_result">
                <script>
                  const answer_result = document.getElementById('answer_result');
                  const isCorrect = false; // 임시 데이터
                  answer_result.innerHTML = `<p class="answer-result" style="color:${isCorrect ? 'green' : '#b90e0a'}">${isCorrect ? 'Pass' : 'Error'}</p>`;
                
                </script>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- <script type="module" src="./js/main.js"></script> -->
  </body>
</html>
